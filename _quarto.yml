project:
  type: website
  output-dir: _site
  # Lists the home page in sitemap.xml as .../ rather than .../index.html
  post-render: fix-sitemap.ts
  resources:
    - assets/social-card.png
    - assets/favicon.png
  render:
    - index.qmd

website:
  title: "Correctness-Aware NL-to-SQL over OCEL"
  description: "Natural-language questions over an object-centric event log (OCEL 2.0), where a verifier decides what is allowed to execute."
  repo-url: "https://github.com/O-2wice/correctness-aware-nl-query-translation-ocel"
  site-url: "https://o-2wice.github.io/correctness-aware-nl-query-translation-ocel/"
  favicon: assets/favicon.png
  # Social previews. `open-graph: true` alone emits a card with no image, which
  # unfurls in Slack, LinkedIn and X as a bare grey box.
  image: assets/social-card.png
  open-graph:
    image-width: 1200
    image-height: 630
    locale: en_GB
  twitter-card:
    card-style: summary_large_image
  navbar:
    title: "Correctness-Aware NL-to-SQL over OCEL"
    left:
      - href: index.qmd
        text: Write-up
      - text: Notebooks
        menu:
          - text: Data Pipeline
            href: https://github.com/O-2wice/correctness-aware-nl-query-translation-ocel/blob/main/notebooks/00_data_pipeline.ipynb
          - text: Schema Exploration
            href: https://github.com/O-2wice/correctness-aware-nl-query-translation-ocel/blob/main/notebooks/01_ocel_schema_exploration.ipynb
          - text: Evaluation
            href: https://github.com/O-2wice/correctness-aware-nl-query-translation-ocel/blob/main/notebooks/02_evaluation.ipynb
          - text: Results
            href: https://github.com/O-2wice/correctness-aware-nl-query-translation-ocel/blob/main/notebooks/03_results.ipynb
    right:
      - icon: github
        href: "https://github.com/O-2wice/correctness-aware-nl-query-translation-ocel"
        aria-label: GitHub repository
format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: styles.css
    toc: true
    toc-depth: 2
    page-layout: article
    code-copy: true
    code-tools: false
    smooth-scroll: true
    link-external-newwindow: true
    # Google Search Console ownership; removing it unverifies the property
    include-in-header:
      text: |
        <meta name="google-site-verification" content="jrY_3kfE94UgAOUETVccWoXGGhYpIR16svPJzQmwXFI" />
