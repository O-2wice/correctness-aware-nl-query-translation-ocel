[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nl2ocel"
version = "0.1.0"
description = "Correctness-aware NL-to-SQL translation for object-centric ERP event logs"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "flask-cors>=4.0",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "numpy>=1.26",
    "rich>=13.7",
    "colorama>=0.4.6",
    "tabulate>=0.9",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
    "duckdb>=1.0",
    "sqlglot>=25.0",
    "pydantic>=2.8",
    "rapidfuzz>=3.9",
    "tqdm>=4.66",
    "streamlit>=1.35",
]

[project.optional-dependencies]
dev = ["pytest>=9.0", "scipy>=1.13"]

[tool.setuptools.packages.find]
where = ["src"]
