<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="540" viewBox="0 0 1040 540" role="img" aria-labelledby="title desc">
  <title id="title">Question to evidence trace for the constrained NL-to-SQL pipeline</title>
  <desc id="desc">Diagram showing how a benchmark question moves through schema retrieval, typed IR, verification, SQL compilation, DuckDB execution, result hashing, and evaluation artifacts.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#457b9d"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .lane { fill: #f6f8fb; stroke: #d9e2ec; stroke-width: 1; }
      .node { fill: #ffffff; stroke: #b8c7d9; stroke-width: 1.4; }
      .node-strong { fill: #eefaf7; stroke: #2a9d8f; stroke-width: 1.6; }
      .node-warm { fill: #fff7ed; stroke: #bc6c25; stroke-width: 1.4; }
      .line { stroke: #457b9d; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .soft-line { stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 5 5; fill: none; }
      .title { fill: #14213d; font: 700 21px Inter, Segoe UI, Arial, sans-serif; }
      .subtitle { fill: #52616b; font: 400 12px Inter, Segoe UI, Arial, sans-serif; }
      .label { fill: #14213d; font: 700 13px Inter, Segoe UI, Arial, sans-serif; }
      .small { fill: #52616b; font: 400 11px Inter, Segoe UI, Arial, sans-serif; }
      .file { fill: #1d4ed8; font: 600 11px Consolas, Menlo, monospace; }
      .pill { fill: #f6f8fb; stroke: #d9e2ec; stroke-width: 1; }
    </style>
  </defs>

  <rect class="bg" width="1040" height="540"/>
  <text x="520" y="34" text-anchor="middle" class="title">One question, traced end to end</text>
  <text x="520" y="56" text-anchor="middle" class="subtitle">Question, plan, checks, SQL and result evidence, and the metrics they aggregate into.</text>

  <rect x="36" y="84" width="290" height="374" rx="12" class="lane"/>
  <rect x="374" y="84" width="290" height="374" rx="12" class="lane"/>
  <rect x="712" y="84" width="290" height="374" rx="12" class="lane"/>
  <text x="181" y="112" text-anchor="middle" class="label">Question And Context</text>
  <text x="519" y="112" text-anchor="middle" class="label">Correctness Boundary</text>
  <text x="857" y="112" text-anchor="middle" class="label">Execution And Evidence</text>

  <rect x="68" y="142" width="226" height="76" rx="8" class="node"/>
  <text x="181" y="166" text-anchor="middle" class="label">Benchmark Question</text>
  <text x="181" y="187" text-anchor="middle" class="small">Natural language, split, gold hash</text>
  <text x="181" y="207" text-anchor="middle" class="file">benchmark/*.csv</text>

  <rect x="68" y="286" width="226" height="76" rx="8" class="node"/>
  <text x="181" y="310" text-anchor="middle" class="label">Schema Slice</text>
  <text x="181" y="331" text-anchor="middle" class="small">Tables, columns, enums, relations</text>
  <text x="181" y="351" text-anchor="middle" class="file">schema_retriever.py</text>

  <rect x="406" y="142" width="226" height="76" rx="8" class="node-warm"/>
  <text x="519" y="166" text-anchor="middle" class="label">Typed IR</text>
  <text x="519" y="187" text-anchor="middle" class="small">Intent, filters, joins, aggregation</text>
  <text x="519" y="207" text-anchor="middle" class="file">nl_to_ir.py</text>

  <rect x="406" y="286" width="226" height="76" rx="8" class="node-strong"/>
  <text x="519" y="310" text-anchor="middle" class="label">Verifier And Policy</text>
  <text x="519" y="331" text-anchor="middle" class="small">Rejects invalid schema or relation paths</text>
  <text x="519" y="351" text-anchor="middle" class="file">query_verifier.py</text>

  <rect x="744" y="142" width="226" height="76" rx="8" class="node"/>
  <text x="857" y="166" text-anchor="middle" class="label">Compiled SQL</text>
  <text x="857" y="187" text-anchor="middle" class="small">DuckDB SQL from accepted IR</text>
  <text x="857" y="207" text-anchor="middle" class="file">ir_to_sql.py</text>

  <rect x="744" y="286" width="226" height="76" rx="8" class="node"/>
  <text x="857" y="310" text-anchor="middle" class="label">Result Evidence</text>
  <text x="857" y="331" text-anchor="middle" class="small">Rows, status, latency, hash</text>
  <text x="857" y="351" text-anchor="middle" class="file">result_hash.py</text>

  <path d="M 294 180 C 342 180, 356 180, 406 180" class="line"/>
  <path d="M 519 218 L 519 286" class="line"/>
  <path d="M 632 324 C 680 324, 694 180, 744 180" class="line"/>
  <path d="M 857 218 L 857 286" class="line"/>
  <path d="M 181 218 L 181 286" class="soft-line"/>
  <path d="M 294 324 C 342 324, 356 324, 406 324" class="line"/>

  <rect x="144" y="410" width="752" height="62" rx="10" class="pill"/>
  <text x="520" y="434" text-anchor="middle" class="label">Evaluation Artifacts</text>
  <text x="520" y="455" text-anchor="middle" class="small">Saved reports aggregate execution rate, denotation accuracy, join policy failures, latency, ablations, and per-class behavior.</text>
  <text x="520" y="477" text-anchor="middle" class="file">outputs/reports/*.csv</text>

  <path d="M 857 362 C 857 400, 760 408, 706 410" class="line"/>
  <path d="M 519 362 C 519 394, 519 398, 519 410" class="soft-line"/>
</svg>
