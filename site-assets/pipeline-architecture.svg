<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720" role="img" aria-labelledby="title desc">
  <title id="title">Correctness-aware NL-to-SQL pipeline architecture</title>
  <desc id="desc">Architecture diagram showing a natural-language question flowing through schema retrieval, typed IR translation, verifier repair and reject paths, deterministic SQL compilation, SQL policy checks, DuckDB execution, and result hashing with provenance.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2a9d8f"/>
    </marker>
    <marker id="arrow-warm" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#bc6c25"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#14213d" flood-opacity="0.14"/>
    </filter>
    <style>
      .bg { fill: #ffffff; }
      .lane { fill: #f7fafc; stroke: #d9e2ec; stroke-width: 1.2; }
      .lane-title { fill: #52616b; font: 700 13px Inter, Segoe UI, Arial, sans-serif; letter-spacing: 0; text-transform: uppercase; }
      .box { fill: #ffffff; stroke: #c8d7df; stroke-width: 1.4; filter: url(#shadow); }
      .box-blue { stroke: #457b9d; }
      .box-teal { stroke: #2a9d8f; }
      .box-warm { stroke: #bc6c25; }
      .box-gray { stroke: #6b7280; }
      .reject { fill: #fff7ed; stroke: #bc6c25; stroke-width: 1.4; filter: url(#shadow); }
      .artifact { fill: #eff6ff; stroke: #9bbbd3; stroke-width: 1.2; }
      .title { fill: #14213d; font: 700 17px Inter, Segoe UI, Arial, sans-serif; }
      .small-title { fill: #14213d; font: 700 14px Inter, Segoe UI, Arial, sans-serif; }
      .text { fill: #52616b; font: 400 12px Inter, Segoe UI, Arial, sans-serif; }
      .code { fill: #14213d; font: 600 12px Consolas, Menlo, monospace; }
      .metric { fill: #2a9d8f; font: 700 13px Inter, Segoe UI, Arial, sans-serif; }
      .line { fill: none; stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }
      .line-soft { fill: none; stroke: #94a3b8; stroke-width: 1.8; stroke-dasharray: 5 5; marker-end: url(#arrow); }
      .line-teal { fill: none; stroke: #2a9d8f; stroke-width: 2.4; marker-end: url(#arrow-teal); }
      .line-warm { fill: none; stroke: #bc6c25; stroke-width: 2.2; marker-end: url(#arrow-warm); }
      .loop { fill: none; stroke: #bc6c25; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow-warm); }
    </style>
  </defs>

  <rect class="bg" width="1180" height="720"/>
  <text x="590" y="38" text-anchor="middle" class="title">Pipeline architecture</text>
  <text x="590" y="60" text-anchor="middle" class="text">The model proposes a typed plan; code and configuration decide whether it can become SQL.</text>

  <rect x="34" y="92" width="338" height="548" rx="16" class="lane"/>
  <rect x="421" y="92" width="338" height="548" rx="16" class="lane"/>
  <rect x="808" y="92" width="338" height="548" rx="16" class="lane"/>
  <text x="60" y="122" class="lane-title">Interpretation</text>
  <text x="447" y="122" class="lane-title">Correctness Boundary</text>
  <text x="834" y="122" class="lane-title">Execution And Evidence</text>

  <rect x="70" y="160" width="250" height="82" rx="10" class="box box-blue"/>
  <text x="95" y="188" class="small-title">Business Question</text>
  <text x="95" y="211" class="text">Natural-language request over</text>
  <text x="95" y="229" class="text">order-to-cash event data</text>

  <rect x="70" y="292" width="250" height="90" rx="10" class="box box-blue"/>
  <text x="95" y="321" class="small-title">Schema Retrieval</text>
  <text x="95" y="344" class="text">Compact prompt context from</text>
  <text x="95" y="362" class="code">schema_catalog.json</text>

  <rect x="70" y="432" width="250" height="98" rx="10" class="box box-blue"/>
  <text x="95" y="461" class="small-title">Translator</text>
  <text x="95" y="484" class="text">Produces typed IR instead of</text>
  <text x="95" y="502" class="text">final raw SQL</text>
  <text x="95" y="520" class="code">intent + filters + joins</text>

  <rect x="455" y="150" width="270" height="106" rx="10" class="box box-teal"/>
  <text x="480" y="180" class="small-title">Typed IR</text>
  <text x="480" y="203" class="text">Small structured query plan</text>
  <text x="480" y="221" class="text">that can be inspected before</text>
  <text x="480" y="239" class="text">anything reaches DuckDB</text>

  <rect x="455" y="304" width="270" height="116" rx="10" class="box box-teal"/>
  <text x="480" y="334" class="small-title">Verifier</text>
  <text x="480" y="357" class="text">Checks schema, enum values,</text>
  <text x="480" y="375" class="text">aggregations, predicates, and</text>
  <text x="480" y="393" class="text">object-centric relation paths</text>

  <rect x="455" y="474" width="270" height="90" rx="10" class="reject"/>
  <text x="480" y="504" class="small-title">Reject Or Repair</text>
  <text x="480" y="527" class="text">Invalid plans do not execute.</text>
  <text x="480" y="545" class="text">Repairable errors become hints.</text>

  <rect x="840" y="142" width="270" height="92" rx="10" class="box box-gray"/>
  <text x="865" y="172" class="small-title">Deterministic Compiler</text>
  <text x="865" y="195" class="text">Accepted IR becomes DuckDB SQL</text>
  <text x="865" y="213" class="code">src/nl2ocel/ir_to_sql.py</text>

  <rect x="840" y="282" width="270" height="92" rx="10" class="box box-gray"/>
  <text x="865" y="312" class="small-title">SQL Policy Check</text>
  <text x="865" y="335" class="text">Read-only tables, allowed forms,</text>
  <text x="865" y="353" class="code">configs/sql_policy.yaml</text>

  <rect x="840" y="424" width="270" height="92" rx="10" class="box box-gray"/>
  <text x="865" y="454" class="small-title">DuckDB Execution</text>
  <text x="865" y="477" class="text">Runs against OCEL parquet views</text>
  <text x="865" y="495" class="code">events / objects / relations</text>

  <rect x="840" y="566" width="270" height="92" rx="10" class="box box-teal"/>
  <text x="865" y="596" class="small-title">Result Evidence</text>
  <text x="865" y="619" class="text">Stable result hash, row count,</text>
  <text x="865" y="637" class="text">joins used, provenance metadata</text>

  <rect x="405" y="642" width="370" height="48" rx="9" class="artifact"/>
  <text x="428" y="672" class="code">relation_whitelist.json + schema_catalog.json + sql_policy.yaml</text>

  <path class="line" d="M195 242 L195 292"/>
  <path class="line" d="M195 382 L195 432"/>
  <path class="line-teal" d="M320 481 C372 481, 388 203, 455 203"/>
  <path class="line-teal" d="M590 256 L590 304"/>
  <path class="line-teal" d="M725 362 C774 362, 784 188, 840 188"/>
  <path class="line" d="M975 234 L975 282"/>
  <path class="line" d="M975 374 L975 424"/>
  <path class="line-teal" d="M975 516 L975 566"/>
  <path class="line-warm" d="M590 420 L590 474"/>
  <path class="loop" d="M455 526 C342 526, 342 481, 320 481"/>
  <path class="line-soft" d="M590 642 L590 420"/>
  <path class="line-soft" d="M775 666 C820 666, 820 328, 840 328"/>

  <text x="738" y="344" class="metric">accept</text>
  <text x="607" y="455" class="text">reject</text>
  <text x="346" y="545" class="text">repair hint</text>
  <text x="594" y="628" text-anchor="middle" class="text">configuration constrains the valid query space</text>
</svg>
