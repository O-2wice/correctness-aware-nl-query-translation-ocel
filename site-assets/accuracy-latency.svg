<svg xmlns="http://www.w3.org/2000/svg" width="980" height="500" viewBox="0 0 980 500" role="img" aria-labelledby="title desc">
<title id="title">Denotation accuracy against average latency</title>
<desc id="desc">Scatter plot of denotation accuracy against average latency for four methods on both splits. Circles mark the development split and squares the held-out test split; a faint connector joins the two splits of the same method, and marker size encodes execution rate. The constrained pipeline sits highest on accuracy at 3.3 seconds, while the few-shot baseline sits lowest at over 40 seconds.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="490.0" y="32" font-size="20" fill="#14213d" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700">Denotation accuracy against average latency</text>
<text x="490.0" y="54" font-size="12" fill="#52616b" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="400">Verification, repair and compilation add about 1.2 seconds over the zero-shot baseline.</text>

<!-- horizontal gridlines -->
<line x1="78" y1="360.9" x2="940" y2="360.9" stroke="#d9e2ec" stroke-width="1"/>
<text x="66" y="364.875" font-size="11" fill="#52616b" text-anchor="end" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="400">20%</text>
<line x1="78" y1="249.0" x2="940" y2="249.0" stroke="#d9e2ec" stroke-width="1"/>
<text x="66" y="253.0" font-size="11" fill="#52616b" text-anchor="end" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="400">40%</text>
<line x1="78" y1="137.1" x2="940" y2="137.1" stroke="#d9e2ec" stroke-width="1"/>
<text x="66" y="141.125" font-size="11" fill="#52616b" text-anchor="end" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="400">60%</text>

<!-- vertical gridlines (log latency) -->
<line x1="142.5" y1="70" x2="142.5" y2="428" stroke="#d9e2ec" stroke-width="1"/>
<text x="142.5" y="458" font-size="11" fill="#52616b" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="400">2s</text>
<line x1="348.1" y1="70" x2="348.1" y2="428" stroke="#d9e2ec" stroke-width="1"/>
<text x="348.1" y="458" font-size="11" fill="#52616b" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="400">5s</text>
<line x1="503.5" y1="70" x2="503.5" y2="428" stroke="#d9e2ec" stroke-width="1"/>
<text x="503.5" y="458" font-size="11" fill="#52616b" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="400">10s</text>
<line x1="659.0" y1="70" x2="659.0" y2="428" stroke="#d9e2ec" stroke-width="1"/>
<text x="659.0" y="458" font-size="11" fill="#52616b" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="400">20s</text>
<line x1="864.5" y1="70" x2="864.5" y2="428" stroke="#d9e2ec" stroke-width="1"/>
<text x="864.5" y="458" font-size="11" fill="#52616b" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="400">50s</text>

<!-- split connectors: each method's dev and test point -->
<line x1="156.6" y1="238.4" x2="167.3" y2="241.7" stroke="#6b7280" stroke-width="1.5" opacity="0.35"/>
<line x1="835.2" y1="402.8" x2="815.1" y2="360.9" stroke="#bc6c25" stroke-width="1.5" opacity="0.35"/>
<line x1="502.8" y1="246.0" x2="510.5" y2="217.4" stroke="#457b9d" stroke-width="1.5" opacity="0.35"/>
<line x1="256.3" y1="109.9" x2="253.4" y2="193.1" stroke="#2a9d8f" stroke-width="1.5" opacity="0.35"/>

<!-- B1 zero-shot -->
<circle cx="156.6" cy="238.4" r="12.2" fill="#6b7280" opacity="0.92" stroke="#fff" stroke-width="2"/>
<rect x="156.6" y="231.0" width="21.4" height="21.4" rx="3" fill="#6b7280" opacity="0.55" stroke="#fff" stroke-width="2"/>
<text x="167.0" y="207" font-size="11" fill="#14213d" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600">B1 Zero-shot</text>

<!-- B2 few-shot -->
<circle cx="835.2" cy="402.8" r="13.0" fill="#bc6c25" opacity="0.92" stroke="#fff" stroke-width="2"/>
<rect x="804.0" y="349.8" width="22.1" height="22.1" rx="3" fill="#bc6c25" opacity="0.55" stroke="#fff" stroke-width="2"/>
<text x="792.0" y="386" font-size="11" fill="#14213d" text-anchor="end" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600">B2 Few-shot</text>

<!-- B3 DIN-SQL -->
<circle cx="502.8" cy="246.0" r="11.0" fill="#457b9d" opacity="0.92" stroke="#fff" stroke-width="2"/>
<rect x="500.8" y="207.7" width="19.4" height="19.4" rx="3" fill="#457b9d" opacity="0.55" stroke="#fff" stroke-width="2"/>
<text x="534.0" y="235" font-size="11" fill="#14213d" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600">B3 DIN-SQL</text>

<!-- constrained pipeline -->
<circle cx="256.3" cy="109.9" r="12.2" fill="#2a9d8f" opacity="0.92" stroke="#fff" stroke-width="2"/>
<rect x="243.4" y="183.1" width="19.9" height="19.9" rx="3" fill="#2a9d8f" opacity="0.55" stroke="#fff" stroke-width="2"/>
<text x="277.0" y="147" font-size="11" fill="#14213d" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700">Constrained pipeline</text>

<!-- legend -->
<circle cx="784" cy="96" r="7.5" fill="#52616b" opacity="0.92"/>
<text x="800" y="100" font-size="11.5" fill="#14213d" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="400">Development</text>
<rect x="776.5" y="115.5" width="15" height="15" rx="3" fill="#52616b" opacity="0.55"/>
<text x="800" y="127" font-size="11.5" fill="#14213d" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="400">Held-out test</text>
<text x="776" y="150" font-size="10.5" fill="#52616b" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="400">Marker size = execution rate</text>

<!-- axis titles -->
<text x="490.0" y="484" font-size="12" fill="#52616b" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="400">Average latency, seconds (log scale)</text>
<text x="26" y="249.0" font-size="12" fill="#52616b" text-anchor="middle" transform="rotate(-90 26 249.0)" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="400">Denotation accuracy</text>
</svg>
